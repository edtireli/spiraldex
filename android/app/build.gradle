plugins { id 'com.android.application' }
def signingFile = rootProject.file('signing.properties')
def releaseKey = new Properties()
if (signingFile.exists()) { signingFile.withInputStream { releaseKey.load(it) } }
android {
 namespace 'app.spiraldex'
 compileSdk 34
 defaultConfig { applicationId 'app.spiraldex'; minSdk 28; targetSdk 34; versionCode 3; versionName '0.3.0' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 signingConfigs {
  release {
   if (signingFile.exists()) {
    storeFile file(releaseKey['storeFile'])
    storePassword releaseKey['storePassword']
    keyAlias releaseKey['keyAlias']
    keyPassword releaseKey['keyPassword']
   }
  }
 }
 buildTypes {
  debug { applicationIdSuffix '.debug'; versionNameSuffix '-dev' }
  release { if (signingFile.exists()) { signingConfig signingConfigs.release } }
 }
}
dependencies { implementation 'androidx.core:core:1.13.1' }
